# Turns an approved "Onboard an app" issue into pull requests.
#
#   label "preview"   renders the templates and posts the result on the issue
#                     (no access to other repos needed)
#   label "approved"  renders, then opens one PR in the app's repository and
#                     one in GitOps-Repo, and links them on the issue
#
# Only people who can add labels (triage and above) can trigger it, and the
# PRs are reviewed like any other: nothing runs until they are merged.
#
# Writing to the other repos: a GitHub App ("goldenpath-bot") installed on
# the org's repos, with Contents and Pull requests read & write. The App ID is
# the repository variable ONBOARDING_APP_ID, its private key the secret
# ONBOARDING_APP_KEY; each run mints a token that lives for one hour and only
# for the two repos it touches. Without the App, "approved" stops with a
# clear message; "preview" still works.
name: Onboard an app

on:
  issues:
    types: [labeled]

permissions:
  contents: read
  issues: write # comments on the issue

concurrency:
  group: onboard-${{ github.event.issue.number }}
  cancel-in-progress: false

env:
  COPIER_VERSION: "9.18.1"

jobs:
  onboard:
    name: ${{ github.event.label.name }}
    if: github.event.label.name == 'preview' || github.event.label.name == 'approved'
    runs-on: ubuntu-latest
    env:
      MODE: ${{ github.event.label.name }}
      ISSUE: ${{ github.event.issue.number }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install Copier
        run: pip install --quiet --disable-pip-version-check "copier==$COPIER_VERSION"

      # The form's answers, validated. An invalid form is reported on the issue.
      - name: Read the form
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          printf '%s' "$ISSUE_BODY" > issue.md
          if ! python scripts/onboarding_answers.py issue.md > answers.json 2> error.txt; then
            # shellcheck disable=SC2016 # backticks in the comment text are Markdown, not shell
            gh issue comment "$ISSUE" --body "$(printf ':x: The form has a problem, please edit it and add the label again:\n\n```\n%s\n```' "$(cat error.txt)")"
            gh issue edit "$ISSUE" --remove-label "$MODE"
            exit 1
          fi
          jq -r 'to_entries[] | "\(.key)=\(.value)"' answers.json | grep -v '^owner=' >> "$GITHUB_ENV"
          echo "app_repo_name=$(jq -r '.repository | split("/")[1]' answers.json)" >> "$GITHUB_ENV"

      # Rendered from this repo's latest release tag on GitHub (Copier's default
      # for a git template), not from the checkout: the rendered repo then
      # records `_src_path: gh:DEVOPS-CANARY/golden-path` and `_commit: vX.Y.Z`,
      # which is what `copier update` needs to move it to a later release.
      - name: Render the templates
        env:
          TEMPLATE: gh:${{ github.repository }}
        run: |
          OUT="$RUNNER_TEMP/out"; echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$OUT/app" "$OUT/gitops"
          copier copy --defaults --trust --data-file answers.json --data template=app-repo "$TEMPLATE" "$OUT/app"
          copier copy --defaults --trust --data-file answers.json --data template=gitops-app "$TEMPLATE" "$OUT/gitops"
          grep -hE '^(_src_path|_commit):' "$OUT/app/.golden-path.yml"
          (cd "$OUT" && find . -type f | sort | sed 's#^\./##') > "$GITHUB_WORKSPACE/files.txt"
          cat files.txt

      - name: Post the preview
        if: env.MODE == 'preview'
        run: |
          {
            echo "### Preview for \`$app\` (\`$repository\`)"
            echo
            echo "These files would be opened as pull requests when the **approved** label is added:"
            echo
            echo '```'; cat files.txt; echo '```'
            while read -r f; do
              echo "<details><summary><code>$f</code></summary>"; echo; echo '```'; cat "$OUT/$f"; echo '```'; echo "</details>"
            done < files.txt
          } > preview.md
          gh issue comment "$ISSUE" --body-file preview.md
          gh issue edit "$ISSUE" --remove-label preview

      - name: Check the App is configured
        if: env.MODE == 'approved' && vars.ONBOARDING_APP_ID == ''
        run: |
          gh issue comment "$ISSUE" --body ":x: The onboarding GitHub App is not configured on this repository (variable \`ONBOARDING_APP_ID\`, secret \`ONBOARDING_APP_KEY\`, see README), so the pull requests cannot be opened."
          gh issue edit "$ISSUE" --remove-label approved
          exit 1

      # A token for this run only: one hour, these two repositories.
      - name: Mint an App token
        if: env.MODE == 'approved'
        id: app-token
        continue-on-error: true # explained on the issue by the next step
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.ONBOARDING_APP_ID }}
          private-key: ${{ secrets.ONBOARDING_APP_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: |
            ${{ env.app_repo_name }}
            GitOps-Repo

      # The usual cause: the App is not installed on the app's repository.
      - name: Explain a token failure
        if: env.MODE == 'approved' && steps.app-token.outcome != 'success'
        run: |
          gh issue comment "$ISSUE" --body "$(printf ':x: Could not get a token for **%s** and **GitOps-Repo**. Usually the GitHub App is not installed on the app repository: in the org settings, GitHub Apps, *goldenpath-bot*, *Configure*, choose **All repositories** (or add the repository), then add the **approved** label again.' "$repository")"
          gh issue edit "$ISSUE" --remove-label approved
          exit 1

      # One PR per repository, on branch onboard/golden-path. Files are copied
      # over the checkout, so re-running updates the same branch.
      - name: Open the pull requests
        if: env.MODE == 'approved'
        env:
          APP_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          GITOPS_REPO: ${{ github.repository_owner }}/GitOps-Repo
        run: |
          # Commits are authored by the App's bot user, so history shows what was automated.
          bot_id=$(GH_TOKEN="$APP_TOKEN" gh api "/users/${APP_SLUG}[bot]" --jq .id)
          git config --global user.name "${APP_SLUG}[bot]"
          git config --global user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          # git pushes and `gh pr create` on the target repos use the App token.
          export GH_TOKEN="$APP_TOKEN"
          gh auth setup-git
          # Writes the PR URL to <out-file>. Any failure (clone, push, PR) ends
          # the step, and the error is reported on the issue by the next step.
          open_pr() { # <repo> <rendered-dir> <base-branch-preference> <title> <body-file> <out-file>
            local repo=$1 src=$2 prefer=$3 title=$4 body=$5 out=$6 dir base url
            dir=$(mktemp -d)
            git clone --quiet "https://github.com/$repo.git" "$dir"
            if git -C "$dir" branch -r | grep -qE "origin/$prefer$"; then base=$prefer; else base=$(git -C "$dir" rev-parse --abbrev-ref HEAD); fi
            git -C "$dir" checkout --quiet "$base"
            git -C "$dir" checkout --quiet -B onboard/golden-path
            cp -R "$src"/. "$dir"/
            git -C "$dir" add -A
            if git -C "$dir" diff --cached --quiet; then echo "$repo: already up to date" > "$out"; return 0; fi
            git -C "$dir" commit --quiet -m "$title" -m "Rendered by the golden path from $GITHUB_SERVER_URL/$GH_REPO/issues/$ISSUE"
            git -C "$dir" push --quiet --force-with-lease origin onboard/golden-path
            url=$(gh pr list --repo "$repo" --head onboard/golden-path --json url --jq '.[0].url')
            [ -n "$url" ] || url=$(gh pr create --repo "$repo" --base "$base" --head onboard/golden-path --title "$title" --body-file "$body")
            echo "$url" > "$out"
          }
          cat > app-pr.md <<EOF
          Opened by the golden path from $GITHUB_SERVER_URL/$GH_REPO/issues/$ISSUE.

          Adds the shared pipeline caller and the Dockerfiles for **$app**. Before merging:
          - [ ] Branches \`develop\`, \`staging\`, \`main\` exist; hotfixes go on \`hotfix/<name>\`
          - [ ] GitHub Environments \`uat\` (develop), \`staging\` (staging, hotfix/*), \`production\` (main, required reviewer)
          - [ ] Each component folder has the scripts the pipeline runs: \`format:check lint typecheck test build\`
          - [ ] The GitOps PR is merged first (the first deploy needs the environment to exist)

          Every PR here then runs the gates; a merge to \`develop\` deploys to UAT.
          EOF
          cat > gitops-pr.md <<EOF
          Opened by the golden path from $GITHUB_SERVER_URL/$GH_REPO/issues/$ISSUE.

          Adds \`apps/$app\` with its UAT environment (rssb-app chart). Image digests are placeholders
          until the app's first deploy from \`develop\` writes the real ones. Before merging:
          - [ ] Seal the secrets listed in \`apps/$app/envs/uat/secrets/README.md\`
          - [ ] Lab: add \`$(echo "$app" | tr 'a-z-' 'A-Z_')_UAT_*_PASSWORD\` to team-secrets and run \`scripts/lab-services.sh\`
          - [ ] Review the shared values (ports, routes, env) with the app's developers

          Once merged, Argo CD creates namespace \`$app-uat\` (walled by policy) and waits for the first image.
          EOF
          open_pr "$repository" "$OUT/app" develop "Golden path: pipeline caller and Dockerfiles for $app" app-pr.md app-pr.url 2>&1 | tee -a push.log
          open_pr "$GITOPS_REPO" "$OUT/gitops" main "Onboard $app: UAT environment" gitops-pr.md gitops-pr.url 2>&1 | tee -a push.log
          export GH_TOKEN="${{ secrets.GITHUB_TOKEN }}"
          # shellcheck disable=SC2016 # backticks in the comment text are Markdown, not shell
          gh issue comment "$ISSUE" --body "$(printf ':rocket: Pull requests opened for `%s`:\n- app repository: %s\n- GitOps-Repo: %s\n\nMerge the GitOps one first, then the app one.' "$app" "$(cat app-pr.url)" "$(cat gitops-pr.url)")"
          gh issue edit "$ISSUE" --remove-label approved --add-label "prs-opened"

      - name: Report a failure on the issue
        if: failure() && env.MODE == 'approved' && steps.app-token.outcome == 'success'
        run: |
          # shellcheck disable=SC2016 # backticks in the comment text are Markdown, not shell
          gh issue comment "$ISSUE" --body "$(printf ':x: Opening the pull requests failed. Fix the cause and add the **approved** label again. Last lines:\n\n```\n%s\n```\n\nA push refused for `.github/workflows/...` means the App lacks the **Workflows: read & write** permission.' "$(tail -n 15 push.log 2>/dev/null || echo 'no log')")"
          gh issue edit "$ISSUE" --remove-label approved
